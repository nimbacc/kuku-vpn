name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: "Android ABIs to build libbox for"
        default: "arm64-v8a,armeabi-v7a,x86_64"

env:
  # ---- the two knobs you may need to touch once ----
  SINGBOX_VERSION: v1.11.15   # pin of the sing-box tag libbox is built from
  ABIS: arm64-v8a,armeabi-v7a,x86_64
  GO_VERSION: "1.24"
  GRADLE_VERSION: "8.9"
  JAVA_VERSION: "17"
  # run #46: third_party/corebind ships no go.sum, so `go mod tidy` verifies
  # EVERY module hash against sum.golang.org on every build — and that service
  # flaked ("reading tile/8/0/x105/686: stream error: INTERNAL_ERROR"), killing
  # an otherwise green build. Module versions are pinned in go.mod and the
  # resolved graph is identical every run, so the sumdb round-trip buys
  # nothing here; off = hashes recorded from the downloaded content, builds
  # deterministic, no sum.golang.org dependency.
  GOSUMDB: off

jobs:
  # ONE aar for BOTH engines. Every gomobile aar embeds the go.Seq runtime —
  # two aars collide ("Duplicate class go.Seq", run #14) and even a hand-stripped
  # pair would run two independent Go runtimes over one JNI Seq protocol and
  # corrupt each other's refnums. So sing-box libbox and the vendored
  # WARP-over-MASQUE engine (usque) are bound together into warpcore.aar
  # (one go.Seq, one libkuku.so). See third_party/corebind/doc.go.
  # Dependency-graph note: sing-box v1.11.x uses the sagernet FORKS
  # (sagernet/gvisor, sagernet/quic-go) while usque uses the upstreams
  # (gvisor.dev/gvisor, quic-go/quic-go) — distinct module paths, no MVS clash.
  core:
    name: build warpcore.aar (libbox + MASQUE engine, one gomobile bind)
    runs-on: ubuntu-latest
    steps:
      - name: checkout kuku-vpn
        uses: actions/checkout@v4

      - name: setup java (gomobile bind needs it)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: setup android ndk r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: export ndk path
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # gomobile v0.1.4 (sagernet fork) pulls golang.org/x/tools v0.16.0, whose
      # tokeninternal hack does NOT compile under go >= 1.25 ("invalid array
      # length -delta * delta", run #13). Install the tools with go 1.24 —
      # the binaries are prebuilt afterwards — and bind with go 1.26, which
      # usque (quic-go 0.60) requires.
      - name: setup go 1.24 (toolchain for building the gomobile binaries)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: install gomobile (sagernet fork, official v1.11.x pin)
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          echo "PATH=$PATH:$(go env GOPATH)/bin" >> "$GITHUB_ENV"

      - name: setup go 1.26 (usque requires >= 1.26.3) for the actual bind
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # tidy resolves BOTH engine graphs (sing-box + usque) and records go.sum;
      # tidy then drops gomobile (doc.go does not import it) — go get re-adds the
      # require the generated bind glue needs (sing-box's own go.mod does the same).
      - name: resolve module graph (both engines) + register gomobile fork
        working-directory: third_party/corebind
        run: |
          go mod tidy
          go get github.com/sagernet/gomobile@v0.1.4
          go mod download github.com/sagernet/gomobile

      # One bind, two Go packages: io.nekohasekai.libbox.* (sing-box core) and
      # io.nekohasekai.warpcore.* (MASQUE engine). Flags mirror the official
      # sing-box `make lib_android` plus the engine package.
      - name: bind libbox + warpcore into one aar
        working-directory: third_party/corebind
        run: |
          gomobile bind \
            -v \
            -o warpcore.aar \
            -target android \
            -androidapi 24 \
            -javapkg=io.nekohasekai \
            -libname=kuku \
            -trimpath \
            -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION} -s -w -buildid=" \
            -tags "with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api" \
            github.com/sagernet/sing-box/experimental/libbox github.com/Diniboy1123/usque/mobile
          ls -lh warpcore.aar

      - name: upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: warpcore
          path: third_party/corebind/warpcore.aar

      # v1.5.0 Psiphon backend: the tunnel core ships as a per-ABI ELF that the
      # app EXECUTES as a child process (like the Xray clients do). Run #19-#21
      # failure history: the module graph forces a modern Go (go.mod >= 1.26),
      # and wlynxg/anet (quic-go's Android shim) then dies at link time on its
      # go:linkname of net.zoneCache — anet's own README prescribes the fix:
      # build with -checklinkname=0.
      # v1.6.0: ALL device ABIs (the v1.5.0 arm64-only build is why 32-bit
      # devices never got a real Psiphon). android/arm (32-bit) REQUIRES
      # external (cgo) linking — proven locally on go 1.24.5 — so the v7a
      # slice compiles with the NDK's armv7a clang as the external linker.
      - name: build psiphon core (console client, all ABIs)
        run: |
          set -e
          git -c core.longpaths=true clone --quiet --depth 50 --branch shirokhorshid \
            https://github.com/CluvexStudio/psiphon-tunnel-core.git /tmp/psiphon
          git -C /tmp/psiphon checkout --quiet 83aa73b9b982e7421e00117f5b0c5aceb5dda452
          out=/tmp/psiphon-out
          mkdir -p "$out/arm64-v8a" "$out/armeabi-v7a" "$out/x86_64"
          ndkbin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd /tmp/psiphon/ConsoleClient
          GOOS=android GOARCH=arm64   CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$out/arm64-v8a/libpsiphon.so" .
          # android/amd64 and android/arm BOTH require external (cgo) linking —
          # only android/arm64 links internally (CI run #26 evidence)
          GOOS=android GOARCH=amd64   CGO_ENABLED=1 CC="$ndkbin/x86_64-linux-android24-clang" go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$out/x86_64/libpsiphon.so" .
          GOOS=android GOARCH=arm     CGO_ENABLED=1 CC="$ndkbin/armv7a-linux-androideabi24-clang" go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$out/armeabi-v7a/libpsiphon.so" .
          ls -lh "$out"/*/

      - name: upload psiphon artifact
        uses: actions/upload-artifact@v4
        with:
          name: psiphon
          path: /tmp/psiphon-out

      # v1.6.0 Tor backend: FOUR per-ABI executables per device slice —
      #  - libtor.so       : tor 0.4.8.16 from the Tor Project's kmp-tor
      #                      packaging (resource-compilation-lib-tor-android).
      #                      It is a shared library exporting the libtor C API
      #                      (tor_main); our third_party/torshim/torrun.c PIE
      #                      executable dlopens it and calls tor_main — so tor
      #                      runs as a child process exactly like libpsiphon.so
      #                      (piped stdout, destroy/destroyForcibly teardown).
      #  - libtorrun.so    : the shim compiled here with the NDK clang.
      #  - liblyrebird.so  : obfs4 (+ meek_lite) pluggable transport.
      #  - libwebtunnel.so : webtunnel pluggable transport.
      #  - libsnowflake.so : snowflake pluggable transport (v1.6.8) — the
      #                      domain-fronted transport that survives where the
      #                      IP-based obfs4/webtunnel bridges get swept.
      # PT sources come from the OFFICIAL Go module proxy
      # (proxy.golang.org serves gitlab.torproject.org modules) at PINNED
      # versions — no git clone of gitlab.torproject.org needed. The PT
      # builds are the same checklinkname=0 recipe as psiphon (quic-go in
      # the graph), and 32-bit arm goes through the NDK external linker.
      - name: build tor shim (libtorrun, all ABIs)
        run: |
          set -e
          out=/tmp/tor-out
          mkdir -p "$out/arm64-v8a" "$out/armeabi-v7a" "$out/x86_64"
          ndkbin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc_arm64="$ndkbin/aarch64-linux-android24-clang"
          cc_arm="$ndkbin/armv7a-linux-androideabi24-clang"
          cc_x64="$ndkbin/x86_64-linux-android24-clang"
          "$cc_arm64" -O2 -s third_party/torshim/torrun.c -o "$out/arm64-v8a/libtorrun.so" -ldl
          "$cc_arm"   -O2 -s third_party/torshim/torrun.c -o "$out/armeabi-v7a/libtorrun.so" -ldl
          "$cc_x64"   -O2 -s third_party/torshim/torrun.c -o "$out/x86_64/libtorrun.so" -ldl
          file "$out"/*/libtorrun.so

      - name: fetch tor binary (kmp-tor packaging, all ABIs)
        run: |
          set -e
          out=/tmp/tor-out
          kv=408.16.4
          aar=$(mktemp -d)/tor.aar
          curl -sfL --retry 3 -o "$aar" \
            "https://repo1.maven.org/maven2/io/matthewnelson/kmp-tor/resource-compilation-lib-tor-android/$kv/resource-compilation-lib-tor-android-$kv.aar"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -o -q -j "$aar" "jni/$abi/libtor.so" -d "$out/$abi/"
          done
          file "$out"/*/libtor.so

      - name: build pluggable transports (lyrebird obfs4 + webtunnel + snowflake, all ABIs)
        run: |
          set -e
          out=/tmp/tor-out
          ndkbin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CGO_ENABLED=0
          L=gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird/cmd/lyrebird
          W=gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/webtunnel/main/client
          S=git.torproject.org/pluggable-transports/snowflake.git/v2/client
          work=$(mktemp -d)
          cd "$work"
          go mod init kuku-pt >/dev/null
          # pinned versions (lyrebird is pseudo-versioned — no semver tags upstream)
          go get gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird/cmd/lyrebird@v0.0.0-20261104192811-59ac7e400c38
          go get gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/webtunnel/main/client@v0.0.7
          # v1.6.8: snowflake client v2.5.1 — the transport that survives where
          # IP-based obfs4/webtunnel bridges get swept (domain-fronted broker,
          # WebRTC data channels; the sandbox proved the exact build recipe and
          # the bridge-line handshake against real tor 0.4.8)
          go get git.torproject.org/pluggable-transports/snowflake.git/v2/client@v2.5.1
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              # only android/arm64 links internally; amd64/arm need the NDK clang
              arm64-v8a)   garch=arm64; cgo=0; cc="" ;;
              x86_64)      garch=amd64; cgo=1; cc="$ndkbin/x86_64-linux-android24-clang" ;;
              armeabi-v7a) garch=arm;   cgo=1; cc="$ndkbin/armv7a-linux-androideabi24-clang" ;;
            esac
            GOOS=android GOARCH=$garch CGO_ENABLED=$cgo CC="$cc" \
              go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$out/$abi/liblyrebird.so" "$L"
            GOOS=android GOARCH=$garch CGO_ENABLED=$cgo CC="$cc" \
              go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$out/$abi/libwebtunnel.so" "$W"
            GOOS=android GOARCH=$garch CGO_ENABLED=$cgo CC="$cc" \
              go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$out/$abi/libsnowflake.so" "$S"
          done
          ls -lh "$out"/*/

      - name: upload tor artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor
          path: /tmp/tor-out

  build:
    name: build APK
    needs: [core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required by attest-build-provenance (Sigstore OIDC)
      attestations: write  # to store the generated attestation
    steps:
      - name: checkout kuku-vpn
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: download warpcore (combined libbox + MASQUE engine aar)
        uses: actions/download-artifact@v4
        with:
          name: warpcore
          path: app/libs

      - name: download psiphon core (libpsiphon.so per ABI → jniLibs)
        uses: actions/download-artifact@v4
        with:
          name: psiphon
          path: app/src/main/jniLibs

      - name: download tor binaries (libtor/libtorrun/lyrebird/webtunnel/snowflake → jniLibs)
        uses: actions/download-artifact@v4
        with:
          name: tor
          path: app/src/main/jniLibs

      # v1.6.9 — the Tor bridge snapshot is now LIVENESS-TESTED at build time.
      # (v1.6.0–v1.6.8 shipped slices of the scriptzteam dump; that collector
      # STOPPED UPDATING on 2026-07-29 and only ~11% of its July obfs4 lines
      # still accept TCP — dead bridges were the tor "never connects" decay.)
      # Now: official moat lines (fresh) FIRST, then a RANDOM slice of the
      # collector lines that still accept TCP, garbage IPs filtered. The
      # snowflake asset is builtin and untouched. The app repeats the same
      # TCP test on-device before every tor boot (TorEngine v1.6.9).
      - name: refresh tor bridge snapshot (liveness-tested)
        run: |
          ok=0
          curl -sfL --retry 2 --max-time 60 -A "Mozilla/5.0" -o /tmp/moat-obfs4.html "https://bridges.torproject.org/bridges?transport=obfs4" && ok=$((ok+1)) || true
          sleep 5
          curl -sfL --retry 2 --max-time 60 -A "Mozilla/5.0" -o /tmp/moat-webtunnel.html "https://bridges.torproject.org/bridges?transport=webtunnel" && ok=$((ok+1)) || true
          curl -sfL --retry 2 --max-time 60 -o /tmp/bridges-obfs4.txt https://raw.githubusercontent.com/scriptzteam/Tor-Bridges-Collector/main/bridges-obfs4 || true
          curl -sfL --retry 2 --max-time 60 -o /tmp/bridges-webtunnel.txt https://raw.githubusercontent.com/scriptzteam/Tor-Bridges-Collector/main/bridges-webtunnel || true
          echo "sources: moat=$ok/2 collector-obfs4=$( [ -s /tmp/bridges-obfs4.txt ] && wc -l < /tmp/bridges-obfs4.txt || echo 0) collector-webtunnel=$( [ -s /tmp/bridges-webtunnel.txt ] && wc -l < /tmp/bridges-webtunnel.txt || echo 0)"
          # exit 3 = every source failed AND produced zero alive lines — keep
          # the committed (itself liveness-tested) snapshot; the app re-tests
          # on-device and can fetch fresh lines through WARP at boot anyway
          if ! python3 scripts/bridge_sample.py app/src/main/assets \
              --moat-obfs4 /tmp/moat-obfs4.html --moat-webtunnel /tmp/moat-webtunnel.html \
              --stz-obfs4 /tmp/bridges-obfs4.txt --stz-webtunnel /tmp/bridges-webtunnel.txt; then
            echo "::warning::zero alive bridges from all sources — shipping the committed snapshot"
            git checkout -- app/src/main/assets/tor_bridges_obfs4.txt app/src/main/assets/tor_bridges_webtunnel.txt
          fi
          grep -cv '^#' app/src/main/assets/tor_bridges_obfs4.txt app/src/main/assets/tor_bridges_webtunnel.txt || true

      - name: security guard — no signing material in git (RIX-style hygiene)
        run: |
          tracked=$(git ls-files | grep -Ei '(^|/)(keystore|release\.keystore|[A-Za-z0-9_-]+\.(jks|p12)|keystore\.properties)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::signing material is tracked in git: $tracked"
            exit 1
          fi
          echo "OK — no signing material tracked"

      - name: restore signing material from secrets (optional)
        env:
          KUKU_KEYSTORE_B64: ${{ secrets.KUKU_KEYSTORE_B64 }}
          KUKU_KEYSTORE_PASSWORD: ${{ secrets.KUKU_KEYSTORE_PASSWORD }}
          KUKU_KEY_ALIAS: ${{ secrets.KUKU_KEY_ALIAS }}
          KUKU_KEY_PASSWORD: ${{ secrets.KUKU_KEY_PASSWORD }}
        run: |
          if [ -n "$KUKU_KEYSTORE_B64" ]; then
            printf '%s' "$KUKU_KEYSTORE_B64" | base64 -d > app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KUKU_KEYSTORE_PASSWORD"
              echo "keyAlias=$KUKU_KEY_ALIAS"
              echo "keyPassword=$KUKU_KEY_PASSWORD"
            } > app/keystore.properties
            echo "release signing: ENABLED (from secrets)"
          else
            echo "::warning::no KUKU_KEYSTORE_B64 secret — release APK will be UNSIGNED (debug APK is still signed by the debug key)"
          fi

      - name: build APKs
        run: |
          gradle :app:assembleRelease :app:assembleDebug --stacktrace

      - name: collect release files
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          mkdir -p dist
          # v1.6.0 ABI splits: app-<abi>-<kind>.apk + app-universal-<kind>.apk
          for kind in release debug; do
            for f in app/build/outputs/apk/$kind/*.apk; do
              base=$(basename "$f") # e.g. app-arm64-v8a-release.apk / ...-release-unsigned.apk
              # % strips SUFFIXES, so peel ".apk" first and then each tag
              # segment — "${x%-unsigned}" never matched "...-unsigned.apk"
              # and produced Kuku-<ver>-<abi>-release-unsigned.apk.apk
              tag="${base#app-}"; tag="${tag%.apk}"; tag="${tag%-unsigned}"; tag="${tag%-release}"; tag="${tag%-debug}" # arm64-v8a | universal
              if [ "$kind" = "release" ]; then
                cp "$f" "dist/Kuku-${VER}-${tag}.apk"
              else
                cp "$f" "dist/Kuku-${VER}-${tag}-debug.apk"
              fi
            done
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cd ..
          cat dist/SHA256SUMS.txt
          ls -lh dist/

      - name: build provenance attestation (forks of this repo fail this check by design)
        if: github.event_name == 'push'
        continue-on-error: true # attestation is best-effort; never block the APK upload
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuku-apks
          path: dist/

      - name: publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
